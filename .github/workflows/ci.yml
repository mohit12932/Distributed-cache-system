name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
        
    - name: Build project
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j $(nproc)
        
    - name: Run LRU Cache Tests
      run: ./build/cache_tests
      
    - name: Run Concurrency Tests
      run: ./build/concurrency_tests
      
    - name: Run RESP Parser Tests
      run: ./build/resp_tests

  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build project
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release
        
    - name: Run LRU Cache Tests
      run: .\build\Release\cache_tests.exe
      
    - name: Run Concurrency Tests
      run: .\build\Release\concurrency_tests.exe
      
    - name: Run RESP Parser Tests
      run: .\build\Release\resp_tests.exe

  integration-test:
    runs-on: ubuntu-latest
    needs: build-linux
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build and Start Docker Cluster
      run: |
        docker compose build
        docker compose up -d
        
    - name: Verify Cluster Health
      run: |
        sudo apt-get update && sudo apt-get install -y redis-tools
        for i in {1..10}; do
          if redis-cli -h 127.0.0.1 -p 6379 -a "MySuperSecret" PING | grep -q "PONG"; then
            echo "Cluster is up!"
            exit 0
          fi
          echo "Waiting for cluster to boot..."
          sleep 5
        done
        echo "Cluster failed to start"
        exit 1
        
    - name: View Logs on Failure
      if: failure()
      run: docker compose logs
